name: Foundation and billing checks
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disposable configuration
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text('\n'.join(f'{key}={secrets.token_hex(32)}' for key in ['DB_PASSWORD','APP_DB_PASSWORD','JWT_SECRET'])+'\n')
          PY
      - run: python3 scripts/test_setup_env.py
      - run: docker compose build
      - run: docker compose --profile test run --rm tests
      - name: Start application and billing jobs
        run: docker compose up -d api worker scheduler web
      - name: HTTP and background billing smoke test
        run: |
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8080/api/v1/subscriptions/plans
          docker compose exec -T api python scripts/smoke_billing.py
      - if: failure()
        run: docker compose logs --tail=100 migrate api worker scheduler
      - if: always()
        run: docker compose down -v
