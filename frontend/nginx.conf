server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
 location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
 location /docs {
   proxy_pass http://api:8000;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' https://fastapi.tiangolo.com data:; connect-src 'self'; frame-ancestors 'none'" always;
 }
 location /openapi.json { proxy_pass http://api:8000; }
 location / { try_files $uri $uri/ /index.html; }
}
